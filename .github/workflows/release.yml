name: Release on version bump

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml

jobs:
  check-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git tag | grep -q "^${{ steps.version.outputs.tag }}$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.tag }} already exists, skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "New version detected: ${{ steps.version.outputs.tag }}"
          fi

      - name: Install uv
        if: steps.tag_check.outputs.exists == 'false'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build wheel
        if: steps.tag_check.outputs.exists == 'false'
        run: uv build

      - name: Generate release notes
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          LAST_TAG=$(git tag --sort=-version:refname | head -1)

          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" HEAD \
              --invert-grep --grep='^bump:')
          else
            COMMITS=$(git log --pretty=format:"- %s" "$LAST_TAG"..HEAD \
              --invert-grep --grep='^bump:')
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- No user-facing changes"
          fi

          cat > /tmp/release_notes.md << NOTES
          ## What's changed

          $COMMITS

          ## Assets

          - \`cipher-${{ steps.version.outputs.version }}-py3-none-any.whl\` — installable wheel
          - \`cipher-${{ steps.version.outputs.version }}.tar.gz\` — source archive
          NOTES

          echo "--- release notes ---"
          cat /tmp/release_notes.md

      - name: Create release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release_notes.md \
            dist/*.whl dist/*.tar.gz
          echo "✓ Release $TAG published."
